name: VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - 'extensions/vscode-extension/**'
      - 'apps/vscode-webview/**'
      - 'packages/ui/**'
      - 'packages/styles/**'
      - 'packages/client/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/vscode-extension/**'
      - 'apps/vscode-webview/**'
      - 'packages/ui/**'
      - 'packages/styles/**'
      - 'packages/client/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @yapi/styles build
          pnpm --filter @yapi/client build
          pnpm --filter @yapi/ui build

      - name: Build extension
        run: pnpm --filter @yapi/vscode-extension build

      - name: Package extension
        run: |
          cd extensions/vscode-extension
          npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: extensions/vscode-extension/*.vsix
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @yapi/styles build
          pnpm --filter @yapi/client build
          pnpm --filter @yapi/ui build

      - name: Build extension
        run: pnpm --filter @yapi/vscode-extension build

      - name: Publish to VS Code Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        run: |
          cd extensions/vscode-extension
          npx @vscode/vsce publish --no-dependencies -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: ${{ secrets.OVSX_PAT != '' }}
        run: |
          cd extensions/vscode-extension
          npx ovsx publish --no-dependencies -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
