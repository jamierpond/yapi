name: VSCode Extension CI

on:
  push:
    branches: [main]
    paths:
      - 'vscode/**'
  pull_request:
    branches: [main]
    paths:
      - 'vscode/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode/yapi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Compile TypeScript
        run: pnpm run compile-tests

      - name: Build extension
        run: pnpm run package
