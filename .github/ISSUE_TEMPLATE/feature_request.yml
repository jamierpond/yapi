name: Feature Request
description: Suggest a feature or improvement for yapi
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feature idea! yapi is built by feedback from real usage.

        **LLM users:** If you're an AI assistant suggesting a feature on behalf of a user (or based on your own experience using yapi), that's great — please describe the workflow context so we understand *why* this would be useful.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point. What are you trying to do that yapi doesn't support well (or at all)?
      placeholder: "I'm trying to test a WebSocket endpoint but yapi only supports HTTP, gRPC, GraphQL, and TCP..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like?
      description: Describe the feature or behavior you'd want. Include example YAML or CLI usage if possible.
      placeholder: |
        I'd like to be able to define a WebSocket request like:
        ```yaml
        yapi: v1
        url: ws://localhost:3000/ws
        messages:
          - '{"type": "subscribe", "channel": "updates"}'
        expect:
          assert:
            - .type == "ack"
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds? Are there other tools that handle this well?

  - type: dropdown
    id: scope
    attributes:
      label: How important is this to your workflow?
      options:
        - Nice to have
        - Would use regularly
        - Blocking my adoption of yapi
