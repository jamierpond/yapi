yapi: v1
kind: project

# Chain example - Login and fetch user data workflow
# Demonstrates how environment variables work with request chains

defaults:
  vars:
    API_VERSION: v1

environments:
  dev:
    vars:
      AUTH_URL: http://localhost:3000
      API_URL: http://localhost:3000
      TEST_EMAIL: dev-user@example.com
      TEST_PASSWORD: dev123

  staging:
    vars:
      AUTH_URL: https://staging.example.com
      API_URL: https://staging.example.com
      TEST_EMAIL: staging-user@example.com
      TEST_PASSWORD: staging123

  prod:
    vars:
      AUTH_URL: https://api.example.com
      API_URL: https://api.example.com
      TEST_EMAIL: prod-user@example.com
      TEST_PASSWORD: prod123
