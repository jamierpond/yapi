yapi: v1
kind: project

# Advanced example using .env files for secret management
# Shows how to combine .env files with inline variables

defaults:
  env_files:
    - .env
  vars:
    API_VERSION: v1
    RETRY_COUNT: "3"

environments:
  dev:
    env_files:
      - .env.dev
    vars:
      BASE_URL: http://localhost:3000

  staging:
    env_files:
      - .env.staging
    vars:
      BASE_URL: https://staging.example.com

  prod:
    env_files:
      - .env.prod
    vars:
      BASE_URL: https://api.example.com
      RETRY_COUNT: "5"
