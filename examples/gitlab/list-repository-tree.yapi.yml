yapi: v1
# GitLab API - List repository tree
# This example lists files in a GitLab repository recursively
url: https://gitlab.com/api/v4/projects/gitlab-org%2Fgitlab/repository/tree?recursive=true&per_page=100

# For private repos, you would add:
# headers:
#   PRIVATE-TOKEN: ${GITLAB_TOKEN}

jq_filter: ".[] | select(.type == \"blob\" and (.name | endswith(\".md\") or endswith(\".mdx\"))) | {path, type, id}"
