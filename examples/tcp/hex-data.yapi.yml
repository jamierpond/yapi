yapi: v1
method: GET
url: https://api.github.com/search/repositories #?q=language:typescript+stars:>1000&sort=stars&order=de
headers:
  Authorization: Bearer ${GITHUB_PAT}
query:
  q: name:yapi
  per_page: 10
  order: desc
jq_filter: '.items[] | {name: .name, stars: .stargazers_count, url: .html_url}'


