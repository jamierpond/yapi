# GraphQL - GitHub repository info (requires GH_TOKEN)
url: https://api.github.com/graphql

headers:
  Authorization: Bearer ${GH_TOKEN}

graphql: |
  query getRepo($owner: String!, $name: String!) {
    repository(owner: $owner, name: $name) {
      name
      description
      stargazerCount
      forkCount
      primaryLanguage {
        name
        color
      }
      issues(states: OPEN) {
        totalCount
      }
      pullRequests(states: OPEN) {
        totalCount
      }
      releases(first: 1, orderBy: {field: CREATED_AT, direction: DESC}) {
        nodes {
          tagName
          publishedAt
        }
      }
    }
  }

variables:
  owner: "golang"
  name: "go"
