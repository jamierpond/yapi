yapi: v1
# Advanced jq filtering
url: https://jsonplaceholder.typicode.com/users

# Get users with their company names, sorted by name
jq_filter: |
  [.[] | {name, company: .company.name}] | sort_by(.name)

post_script: |
  import * as fs from "fs";
  const outputPath = "output/users_with_companies.json";
  if (!fs.existsSync("output")) {
    fs.mkdirSync("output");
  }
  fs.writeFileSync(outputPath, JSON.stringify(yapiResponse, null, 2));
  console.log(`Filtered data saved to ${outputPath}`);

